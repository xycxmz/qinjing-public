# qinjing corpus v1 -- YAML frozen subset, see docs/02-schema-v1.md.
# Provenance: derived from the author's xiezhi benchmark corpus
# (108 cases), re-licensed here under Apache-2.0 (the upstream repo
# carries no license file); see NOTICE. Migration decisions
# (expected_rules -> expected_signals mapping, intent tag folding,
# TEST-NET neutralization, /tmp bench-path renames, per-case impact
# grading) are recorded in corpus/mapping-notes.md.
# The 80 cases AR01-AR80 are rewritten from Red Canary's Atomic Red
# Team (https://github.com/redcanaryco/atomic-red-team, upstream MIT
# license, Copyright (c) 2018 Red Canary, Inc., upstream commit
# a0e3f9bc69fe): template variables removed, addresses and
# side-effect paths neutralized for isolated runs; see NOTICE.
# Execution order = file order: false_positives first (clean buckets),
# then attacks (tactic-interleaved rounds, chains, detection-surface).

